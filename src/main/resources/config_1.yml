      weight: 1
      winning: true
    a5:
      glyph: 
      weight: 1
      hazure: true
    a6:
      glyph: 
      weight: 1
      match-group: iron
    a7:
      glyph: 
      weight: 1
      match-group: eme
    a8:
      glyph: 
      weight: 1
      match-group: gold
    a9:
      glyph: 
      weight: 1
      match-group: iron
    # --- 中リール b0〜b9 ---
    b0:
      glyph: 
      weight: 1
      match-group: iron
    b1:
      glyph: 
      weight: 1
      match-group: rapi
    b2:
      glyph: 
      weight: 1
      match-group: eme
    b3:
      glyph: 
      weight: 1
      winning: true
    b4:
      glyph: 
      weight: 1
      hazure: true
    b5:
      glyph: 
      weight: 1
      match-group: gold
    b6:
      glyph: 
      weight: 1
      match-group: iron
    b7:
      glyph: 
      weight: 1
      match-group: rapi
    b8:
      glyph: 
      weight: 1
      match-group: eme
    b9:
      glyph: 
      weight: 1
      match-group: gold
    # --- 右リール c0〜c9 ---
    c0:
      glyph: 
      weight: 1
      match-group: rapi
    c1:
      glyph: 
      weight: 1
      match-group: eme
    c2:
      glyph: 
      weight: 1
      match-group: gold
    c3:
      glyph: 
      weight: 1
      match-group: rapi
    c4:
      glyph: 
      weight: 1
      match-group: iron
    c5:
      glyph: 
      weight: 1
      match-group: eme
    c6:
      glyph: 
