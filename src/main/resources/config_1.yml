# 設置型スロット（TextDisplay + Interaction）。マーク画像は resourcepack/.../textures/font/slot_mark_*.png
# フォント割当は resourcepack/.../font/default.json（Private Use: U+E100〜）
# /perocasino slot create <id> で現在位置に台を追加し、enabled を true にします。
slot-display:
  enabled: true
  bet-diamonds: 1
  tick-period: 1
  reel-step-base-ticks: 2
  # ストップ時「次コマがこのIDなら」距離抽選を変える対象（各リールの当たりマーク）
  atari-symbol-ids:
  - a4
  - b3
  - c7
  stop-distance-weights:
    next: 80
    next-next: 20
    when-next-is-atari:
      next: 20
      next-next: 80
  payouts:
    three-atari-multiplier: 20
    triple-same-mark-multiplier: 2
  layout:
    reel-spacing: 0.55
    reel-y-offset: 1.15
    button-forward: 0.45
    button-down: -0.35
  symbols:
    # --- 左リール a0〜a9（ストリップ順 0→9）---
    a0:
      glyph: 
      weight: 1
      match-group: rapi
    a1:
      glyph: 
      weight: 1
      match-group: eme
    a2:
      glyph: 
      weight: 1
      match-group: gold
    a3:
      glyph: 
      weight: 1
      match-group: rapi
    a4:
